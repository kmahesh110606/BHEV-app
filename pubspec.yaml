name: uei_app
description: URJAA - Unified Open EV Charging Infrastructure & CPO Enterprise Suite
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking & State
  http: ^1.2.0
  provider: ^6.1.2
  intl: ^0.19.0

  # UI, Icons & Typography
  google_fonts: ^6.2.1
  fluentui_system_icons: ^1.1.258
  animations: ^2.0.11

  # QR Code & Hardware
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

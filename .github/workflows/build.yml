name: Build Flutter application

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --debug --dart-define=CHARGEGRID_API_URL=${{ vars.CHARGEGRID_API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: chargegrid-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

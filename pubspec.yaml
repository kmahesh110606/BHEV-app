name: uei_app
description: URJAA - Unified Open EV Charging Infrastructure & CPO Enterprise Suite
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking & State
  http: ^1.2.0
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.2.3

  # UI, Icons & Typography
  google_fonts: ^6.2.1
  fluentui_system_icons: ^1.1.258
  animations: ^2.0.11

  # Interactive Map & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  url_launcher: ^6.3.0

  # Live Camera QR Scanner & Generator
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
